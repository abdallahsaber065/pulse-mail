name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

# Do not add workflow-level paths-ignore. If Gates is a required status check
# (main is protected; the protection API is not readable from this token), a
# skipped workflow leaves those checks pending and blocks the merge. Job-level
# `if:` reports skipped jobs as success, and the docs-only stubs below keep the
# same check names (`Gates (Windows)`, `Gates (macOS (Apple Silicon))`,
# `Gates (Linux)`) in case a skipped matrix job never expands.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # `**` matches everything; negated rules drop docs/website-only paths.
          # `some-with-excludes` is required — the default `some` would treat
          # `**` as a match for every file and ignore the exclusions.
          predicate-quantifier: some-with-excludes
          list-files: json
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!**/*.md'
              - '!docs/**'
              - '!site/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'

      - name: Result
        env:
          CODE: ${{ steps.filter.outputs.code }}
          COUNT: ${{ steps.filter.outputs.code_count }}
        run: 'echo "Run Gates: $CODE (non-docs files: $COUNT)"'

  test:
    name: Gates (${{ matrix.name }})
    needs: changes
    # Fail closed: run the matrix unless the filter explicitly said docs-only.
    if: always() && !cancelled() && needs.changes.outputs.code != 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows
          - platform: macos-latest
            name: macOS (Apple Silicon)
          - platform: ubuntu-22.04
            name: Linux

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install dependencies
        run: pnpm install

      - name: Audit JS dependencies
        run: pnpm audit --audit-level high

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Run frontend tests
        run: pnpm test

      - name: Check TypeScript & Frontend build
        run: pnpm build

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # Cheap jobs with the same check names as `test`, so required status checks
  # still go green on a docs-only change instead of staying pending.
  test-docs:
    name: Gates (${{ matrix.name }})
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name:
          - Windows
          - macOS (Apple Silicon)
          - Linux
    steps:
      - name: Skip Gates
        run: echo "Docs-only change; skipping Gates (${{ matrix.name }})."
