# Static landing site → GitHub Pages.
# One-time: repo Settings → Pages → Build and deployment → Source = GitHub Actions.
# Until that is set, this workflow is created but deploys fail with a Pages error.
name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/assets/**"
      - "docs/pulse-mail-logo.png"
      - "scripts/assemble-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: bash scripts/assemble-site.sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
