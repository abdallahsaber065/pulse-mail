name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.2.1)'
        required: true
        default: 'v0.2.1'

jobs:
  # Gates (tests, clippy, fmt) already ran in CI on the PR that merged the
  # tagged commit; tags are cut from protected main, so re-running them here
  # would only duplicate the Windows job on a Linux toolchain install.
  build-release:
    name: Build Windows installer
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri App & Upload to Draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.tag }}
          releaseName: 'Pulse Mail ${{ github.ref_name || inputs.tag }}'
          releaseDraft: true
          prerelease: false

  publish-release:
    name: Publish Release
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name || inputs.tag }}"
          echo "Publishing draft release for tag: $tag"
          gh release edit "$tag" --draft=false

  handle-failure:
    name: Handle Release Build Failure
    if: failure()
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Log Release Failure Notice
        run: |
          echo "::error::The Windows release build failed. The release remains as an unlisted draft to prevent shipping a broken installer."
