name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

jobs:
  # Gates (tests, clippy, fmt) already ran in CI on the PR that merged the
  # tagged commit; tags are cut from protected main, so re-running them here
  # would only duplicate the matrix per platform.
  build-release:
    name: Build ${{ matrix.name }}
    needs: []
    permissions:
      contents: write
    env:
      # Compile-time (`option_env!` in auth/client_config.rs). Empty on forks
      # that haven't copied the secrets — the binary then needs a local JSON.
      # Never echo these; Actions also masks registered secret values in logs.
      PULSE_GOOGLE_CLIENT_ID: ${{ secrets.PULSE_GOOGLE_CLIENT_ID }}
      PULSE_GOOGLE_CLIENT_SECRET: ${{ secrets.PULSE_GOOGLE_CLIENT_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            name: 'Windows (x64)'
          # Apple Silicon only: x86_64-apple-darwin is excluded (broken GitHub
          # builds for this repo, and Intel Macs are the minority).
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: 'macOS (Apple Silicon)'
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'Linux (x64)'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Check embedded OAuth client
        id: oauth
        shell: bash
        env:
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          set +x
          if [ -n "${PULSE_GOOGLE_CLIENT_ID}" ] && [ -n "${PULSE_GOOGLE_CLIENT_SECRET}" ]; then
            echo "embedded=yes" >> "$GITHUB_OUTPUT"
            echo "OAuth desktop client will be compiled into this binary."
          else
            echo "embedded=no" >> "$GITHUB_OUTPUT"
            msg="Repository secrets PULSE_GOOGLE_CLIENT_ID and PULSE_GOOGLE_CLIENT_SECRET are not set. This binary will require google-oauth-client.json at runtime."
            if [ "$IS_FORK" = "true" ]; then
              echo "::warning::$msg"
            else
              echo "::error::$msg Add both at Settings → Secrets and variables → Actions before cutting a release. See docs/RELEASING.md."
              exit 1
            fi
          fi

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
          # Keep caches with/without the baked-in client separate (no secret values).
          prefix-key: v0-rust-oauth-${{ steps.oauth.outputs.embedded }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri App & Upload to Draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PULSE_GOOGLE_CLIENT_ID: ${{ secrets.PULSE_GOOGLE_CLIENT_ID }}
          PULSE_GOOGLE_CLIENT_SECRET: ${{ secrets.PULSE_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name || inputs.tag }}
          releaseName: 'Pulse Mail ${{ github.ref_name || inputs.tag }}'
          args: ${{ matrix.args }}
          releaseDraft: true
          prerelease: false

  publish-release:
    name: Publish Release
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name || inputs.tag }}"
          echo "Publishing draft release for tag: $tag"
          gh release edit "$tag" --draft=false

  handle-failure:
    name: Handle Release Build Failure
    if: failure()
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Log Release Failure Notice
        run: |
          echo "::error::One or more release builds failed. The release remains as an unlisted draft to prevent shipping incomplete or broken platform binaries."
