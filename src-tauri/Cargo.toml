[package]
name = "pulse-mail"
version = "0.1.0"
description = "Pulse Mail: a light, always-on Gmail client for Windows"
authors = ["Abdallah Saber"]
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "pulse_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

tokio = { version = "1", features = ["net", "time", "sync", "macros", "io-util", "rt"] }
futures = "0.3"

# One TLS crypto provider (ring) for both HTTPS and IMAP: no cmake/nasm needed on Windows.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "query", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }

rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2"
mail-parser = "0.11"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"
ammonia = "4.2.4"
mail-builder = "1.0.0"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Com",
] }

[dev-dependencies]
tempfile = "3"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "unwind" # a panic in one sync pass is caught; abort would kill the tray app
strip = true
